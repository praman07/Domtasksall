<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Live Character Counter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="card">
    <h2>Character Counter</h2>

    <textarea id="text" placeholder="Start typing..."></textarea>

    <div class="info">
      <span id="count">0</span>/100 characters
    </div>

    <p id="warning">Character limit exceeded</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
