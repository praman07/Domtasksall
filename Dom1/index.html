<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DOM Homework Tasks - KODEX</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Task 1 -->
  <section>
    <h3>Task 1: Text Change</h3>
    <p id="task1Text">Hello</p>
    <button id="task1Btn">Change Text</button>
  </section>

  <!-- Task 2 -->
  <section>
    <h3>Task 2: Change Box Color</h3>
    <div id="colorBox" class="box"></div>
    <button id="colorBtn">Change Color</button>
  </section>

  <!-- Task 3 -->
  <section>
    <h3>Task 3: Show / Hide Box</h3>
    <div id="hideBox" class="box">Box</div>
    <button id="hideBtn">Toggle</button>
  </section>

  <!-- Task 4 -->
  <section>
    <h3>Task 4: Rotate Box</h3>
    <div id="rotateBox" class="box"></div>
    <button id="leftBtn">Rotate Left</button>
    <button id="rightBtn">Rotate Right</button>
  </section>

  <!-- Task 5 -->
  <section>
    <h3>Task 5: Increase / Decrease</h3>
    <h2 id="count">0</h2>
    <button id="plus">+</button>
    <button id="minus">-</button>
  </section>

  <!-- Task 6 -->
  <section>
    <h3>Task 6: Light / Dark Mode</h3>
    <button id="modeBtn">Change Mode</button>
  </section>

  <!-- Task 7 -->
  <section>
    <h3>Task 7: Show Input Text</h3>
    <input id="textInput" type="text">
    <p id="outputText"></p>
  </section>

  <!-- Task 8 -->
  <section>
    <h3>Task 8: Hover Color Change</h3>
    <div id="hoverBox" class="box"></div>
  </section>

  <!-- Task 9 -->
  <section>
    <h3>Task 9: Button Works Once</h3>
    <p id="onceText"></p>
    <button id="onceBtn">Click Me</button>
  </section>

  <!-- Task 10 -->
  <section>
    <h3>Task 10: Traffic Light</h3>
    <div class="circle" id="red"></div>
    <div class="circle" id="yellow"></div>
    <div class="circle" id="green"></div>
    <br><br>
    <button id="stop">Stop</button>
    <button id="ready">Ready</button>
    <button id="go">Go</button>
  </section>

  <script src="script.js"></script>
</body>
</html>
